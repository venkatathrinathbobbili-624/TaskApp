{% extends "layout.html" %}

{% block content %}
<div class="container auth-layout register-layout">
  <section class="auth-intro">
    <p class="eyebrow">WARRIOR QUEST / NEW WARRIOR</p>
    <h1>Forge your own path.</h1>
    <p>Start your quest journal and turn ambitious goals into your next great deeds.</p>
    <div class="auth-coordinate"><span></span> NEW PROFILE / 02</div>
  </section>
  <section class="card app-panel auth-panel">
    <div class="card-header panel-heading"><span>Create your account</span><span class="panel-meta">02 / REGISTER</span></div>
    <div class="card-body">
      <p id="registerMessage" class="alert alert-info auth-message" aria-live="polite" hidden></p>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" type="email" class="form-control" name="email" required>
          </div>
          <div class="form-group col-md-6">
            <label for="registerUsername">Username</label>
            <input id="registerUsername" type="text" class="form-control" name="username" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="registerFirstname">First Name</label>
            <input id="registerFirstname" type="text" class="form-control" name="firstname" required>
          </div>
          <div class="form-group col-md-6">
            <label for="registerLastname">Last Name</label>
            <input id="registerLastname" type="text" class="form-control" name="lastname" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="registerRole">Role</label>
            <input id="registerRole" type="text" class="form-control" name="role" required>
          </div>
          <div class="form-group col-md-6">
            <label for="registerPhone">Phone Number</label>
            <input id="registerPhone" type="text" class="form-control" name="phone_number" autocomplete="phone_number" required>
          </div>
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" class="form-control" name="password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="registerPassword2">Verify Password</label>
          <input id="registerPassword2" type="password" class="form-control" name="password2" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Create account <span aria-hidden="true">→</span></button>
      </form>
    </div>
    <div class="card-footer auth-footer">
      Already have an account? <a href="/auth/login-page">Sign in</a>
    </div>
  </section>
</div>
{% endblock %}
