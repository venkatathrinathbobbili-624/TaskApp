{% extends "layout.html" %}

{% block content %}
<div class="container form-page">
  <header class="page-heading compact-heading">
    <div>
      <p class="eyebrow">THE JOURNAL / REVISION</p>
      <h1>Refine your quest.</h1>
      <p class="heading-copy">Adjust its details or mark this objective complete.</p>
    </div>
  </header>
  <div class="card app-panel form-panel">
    <div class="card-header panel-heading">
      <span>Edit quest</span><span class="panel-meta">ENTRY #{{todo.id}}</span>
    </div>
    <div class="card-body">
      <form id="editTodoForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="form-control" name="title" value="{{todo.title}}" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" class="form-control" rows="3" required>{{todo.description}}</textarea>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select name="priority" class="form-control">
            <option {% if todo.priority == 1 %} selected="selected" {% endif %}>1</option>
            <option {% if todo.priority == 2 %} selected="selected" {% endif %}>2</option>
            <option {% if todo.priority == 3 %} selected="selected" {% endif %}>3</option>
            <option {% if todo.priority == 4 %} selected="selected" {% endif %}>4</option>
            <option {% if todo.priority == 5 %} selected="selected" {% endif %}>5</option>
          </select>
        </div>
        <div class="form-group form-check">
          <input type="checkbox" class="form-check-input" name="complete" {% if todo.complete %} checked {% endif %}>
          <label class="form-check-label">Complete</label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save changes <span aria-hidden="true">→</span></button>
          <button id="deleteButton" type="button" class="btn btn-danger">Abandon quest</button>
          <a href="/todos/todo-page" class="btn btn-link">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
