{% extends "layout.html" %}

{% block content %}
<div class="container form-page">
  <header class="page-heading compact-heading">
    <div>
      <p class="eyebrow">NEW OBJECTIVE / 01</p>
      <h1>Set your next target.</h1>
      <p class="heading-copy">Give it a clear name, then decide what matters most.</p>
    </div>
  </header>
  <div class="card app-panel form-panel">
    <div class="card-header panel-heading" id="todoCardHeader">
      <span>Task details</span><span class="panel-meta">NEW ENTRY</span>
    </div>
    <div class="card-body">
      <form id="todoForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="form-control" name="title" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea class="form-control" rows="3" name="description" required></textarea>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select class="form-control" name="priority">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Create task <span aria-hidden="true">→</span></button>
          <a href="/todos/todo-page" class="btn btn-link">Cancel</a>
        </div>
      </form>
      <div id="todoSuccess" class="text-center" hidden>
        <p class="alert alert-success success-message" role="status">Todo created successfully.</p>
        <button id="todoSuccessOk" type="button" class="btn btn-primary">OK <span aria-hidden="true">→</span></button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
